<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .screen {
    width: 375px; height: 812px; position: relative; overflow: hidden;
    background: var(--bg);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
  }
  .top-row { position: relative; padding: 56px 20px 0; display: flex; align-items: center; gap: 12px; }
  .back-btn {
    width: 36px; height: 36px; border-radius: 50%; background: var(--card-bg);
    box-shadow: 0 1px 2px rgba(43,36,32,0.06), 0 6px 14px rgba(43,36,32,0.1);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: none;
  }
  .back-btn svg { width: 15px; height: 15px; color: var(--ink-soft); }
  .progress-track { flex: 1; height: 6px; background: var(--track-off); border-radius: 100px; overflow: hidden; }
  .progress-fill { height: 100%; width: 86%; background: var(--accent); border-radius: 100px; }

  .body { position: relative; padding: 30px 24px 24px; height: calc(812px - 92px - 96px); overflow-y: auto; }
  .title { font-size: 25px; font-weight: 800; line-height: 1.3; letter-spacing: -0.01em; margin-bottom: 22px; }

  .footer { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 30px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .continue-btn { width: 100%; height: 54px; border-radius: 18px; border: none; background: var(--accent); color: #2B2420; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 24px color-mix(in oklch, var(--accent) 40%, transparent); display: flex; align-items: center; justify-content: center; position: relative; padding: 0 20px; }
  .continue-btn .arrow { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .continue-btn .arrow svg { width: 18px; height: 18px; }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .card { position: relative; background: var(--card-bg); border-radius: 20px; padding: 16px 12px 14px; box-shadow: 0 1px 2px rgba(43,36,32,0.05), 0 8px 20px rgba(43,36,32,0.06); border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 7px; }
  .card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .check { position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; border-radius: 50%; background: #4CAF6E; display: flex; align-items: center; justify-content: center; }
  .check svg { width: 11px; height: 11px; color: #fff; }
  .icon-circle { width: 42px; height: 42px; border-radius: 13px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; }
  .card.selected .icon-circle { background: #fff; }
  .icon-circle svg { width: 21px; height: 21px; color: color-mix(in oklch, var(--accent) 60%, black); }
  .card-title { font-size: 13.5px; font-weight: 800; }
  .card-desc { font-size: 10.5px; font-weight: 600; color: var(--ink-soft); line-height: 1.3; min-height: 26px; }
  .count-pill { font-size: 11px; font-weight: 800; color: color-mix(in oklch, var(--accent) 60%, black); background: var(--accent-soft); padding: 4px 10px; border-radius: 100px; }
  .card.selected .count-pill { background: #fff; }

</style>
</helmet>

<div class="screen" style="--bg: #F2F3F4; --ink: #2B2420; --ink-soft: #6B5D4F; --ink-faint: #9C8C7A; --card-bg: #FFFDF7; --track-off: #E3E5E7; --accent: {{accent}}; --accent-soft: color-mix(in oklch, var(--accent) 20%, white);">

  <div class="top-row">
    <button class="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="progress-track"><div class="progress-fill"></div></div>
  </div>

  <div class="body">

    <div class="title">Choose your dismiss method</div>
    <div class="grid">

      <div class="card">
        
        <div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9.5" r="1"/><circle cx="15" cy="9.5" r="1"/><circle cx="9" cy="14.5" r="1"/><circle cx="15" cy="14.5" r="1"/></svg></div>
        <div class="card-title">Math</div>
        <div class="card-desc">Solve one equation</div>
        <div class="count-pill">1 problem</div>
      </div>

      <div class="card">
        
        <div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/></svg></div>
        <div class="card-title">Clap</div>
        <div class="card-desc">Clap your hands</div>
        <div class="count-pill">&times;50</div>
      </div>

      <div class="card selected">
        <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
        <div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M4 9l-1.5 1.5M20 9l1.5 1.5"/></svg></div>
        <div class="card-title">Shake Phone</div>
        <div class="card-desc">Shake to dismiss</div>
        <div class="count-pill">&times;50</div>
      </div>

      <div class="card">
        
        <div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l2-6 4 12 2-8 2 4h4"/></svg></div>
        <div class="card-title">Buzzzzz</div>
        <div class="card-desc">Make a loud sound</div>
        <div class="count-pill">&times;10</div>
      </div>

      <div class="card">
        
        <div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" opacity="0.5"/><circle cx="12" cy="12" r="10.5" opacity="0.25"/></svg></div>
        <div class="card-title">Tap</div>
        <div class="card-desc">Tap the screen</div>
        <div class="count-pill">&times;100</div>
      </div>

      <div class="card">
        
        <div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17h3l9-11h4"/><path d="M4 7h3l2.5 3"/><path d="M14.5 14l2.5 3h3"/><path d="M17 3l3 3-3 3"/><path d="M17 15l3 3-3 3"/></svg></div>
        <div class="card-title">Random</div>
        <div class="card-desc">Surprise mission</div>
        <div class="count-pill">Mixes it up</div>
      </div>
    </div>

  </div>

  <div class="footer">
    <button class="continue-btn"><span>Continue</span><span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span></button>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A623","options":["#F5A623","#E8940F","#D98A1F","#C77B14"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F5A623' };
  }
}
</script>
</body>
</html>
