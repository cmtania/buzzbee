<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .screen {
    width: 375px; height: 812px; position: relative; overflow: hidden;
    background: var(--bg);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
    display: flex; flex-direction: column;
  }

  .blob-bg { position: absolute; inset: 0; pointer-events: none; }
  .blob-bg svg { width: 100%; height: 100%; display: block; }

  .hero-area { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 40px 32px 0; }
  .wordmark { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; }
  .tagline { font-size: 14px; font-weight: 600; color: var(--ink-soft); text-align: center; line-height: 1.5; max-width: 260px; }
  .buzz-hero svg { width: 148px; height: 148px; }

  .auth-area { position: relative; padding: 0 28px 46px; display: flex; flex-direction: column; gap: 12px; }

  .auth-btn {
    height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 10px;
    font-family: inherit; font-size: 15.5px; font-weight: 700; cursor: pointer; border: none;
  }
  .auth-btn.apple { background: #1C1B19; color: #fff; }
  .auth-btn.apple svg { width: 18px; height: 18px; }
  .auth-btn.google { background: #fff; color: #2B2420; border: 1.5px solid var(--track-off); }
  .auth-btn.google svg { width: 18px; height: 18px; }

  .legal { text-align: center; font-size: 11px; font-weight: 600; color: var(--ink-faint); margin-top: 6px; line-height: 1.5; padding: 0 12px; }
  .legal b { color: var(--ink-soft); font-weight: 700; }
</style>
</helmet>
