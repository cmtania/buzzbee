<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .screen {
    width: 375px; height: 812px; position: relative; overflow: hidden;
    background: var(--bg);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
  }
  .top-row { position: relative; padding: 56px 20px 0; display: flex; align-items: center; gap: 12px; }
  .back-btn {
    width: 36px; height: 36px; border-radius: 50%; background: var(--card-bg);
    box-shadow: 0 1px 2px rgba(43,36,32,0.06), 0 6px 14px rgba(43,36,32,0.1);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: none;
  }
  .back-btn svg { width: 15px; height: 15px; color: var(--ink-soft); }
  .progress-track { flex: 1; height: 6px; background: var(--track-off); border-radius: 100px; overflow: hidden; }
  .progress-fill { height: 100%; width: 71%; background: var(--accent); border-radius: 100px; }

  .body { position: relative; padding: 30px 24px 24px; height: calc(812px - 92px - 96px); overflow-y: auto; }
  .title { font-size: 25px; font-weight: 800; line-height: 1.3; letter-spacing: -0.01em; margin-bottom: 22px; }

  .footer { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 30px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .continue-btn { width: 100%; height: 54px; border-radius: 18px; border: none; background: var(--accent); color: #2B2420; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 24px color-mix(in oklch, var(--accent) 40%, transparent); display: flex; align-items: center; justify-content: center; position: relative; padding: 0 20px; }
  .continue-btn .arrow { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .continue-btn .arrow svg { width: 18px; height: 18px; }

  .perm-row { display: flex; gap: 14px; padding: 18px 4px; border-bottom: 1px solid var(--track-off); }
  .perm-row:last-child { border-bottom: none; }
  .perm-icon { width: 42px; height: 42px; border-radius: 13px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .perm-icon svg { width: 21px; height: 21px; color: color-mix(in oklch, var(--accent) 60%, black); }
  .perm-title { font-size: 15px; font-weight: 800; }
  .perm-desc { font-size: 12.5px; font-weight: 600; color: var(--ink-faint); margin-top: 3px; line-height: 1.5; }

</style>
</helmet>

<div class="screen" style="--bg: #F2F3F4; --ink: #2B2420; --ink-soft: #6B5D4F; --ink-faint: #9C8C7A; --card-bg: #FFFDF7; --track-off: #E3E5E7; --accent: {{accent}}; --accent-soft: color-mix(in oklch, var(--accent) 20%, white);">

  <div class="top-row">
    <button class="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="progress-track"><div class="progress-fill"></div></div>
  </div>

  <div class="body">

    <div class="title">BuzzBee needs a couple permissions</div>
    <div class="perm-row">
      <div class="perm-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M4 9l-1.5 1.5M20 9l1.5 1.5"/></svg></div>
      <div>
        <div class="perm-title">Motion &amp; Fitness</div>
        <div class="perm-desc">Lets BuzzBee sense light sleep from gentle phone movement during your wake window.</div>
      </div>
    </div>
    <div class="perm-row">
      <div class="perm-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>
      <div>
        <div class="perm-title">Notifications</div>
        <div class="perm-desc">So BuzzBee can ring reliably, even through Silent or Focus mode.</div>
      </div>
    </div>

  </div>

  <div class="footer">
    <button class="continue-btn"><span>Allow &amp; continue</span><span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span></button>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A623","options":["#F5A623","#E8940F","#D98A1F","#C77B14"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F5A623' };
  }
}
</script>
</body>
</html>
