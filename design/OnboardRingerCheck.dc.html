<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .screen {
    width: 375px; height: 812px; position: relative; overflow: hidden;
    background: var(--bg);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
  }
  .top-row { position: relative; padding: 56px 20px 0; display: flex; align-items: center; gap: 12px; }
  .back-btn {
    width: 36px; height: 36px; border-radius: 50%; background: var(--card-bg);
    box-shadow: 0 1px 2px rgba(43,36,32,0.06), 0 6px 14px rgba(43,36,32,0.1);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: none;
  }
  .back-btn svg { width: 15px; height: 15px; color: var(--ink-soft); }
  .progress-track { flex: 1; height: 6px; background: var(--track-off); border-radius: 100px; overflow: hidden; }
  .progress-fill { height: 100%; width: 100%; background: var(--accent); border-radius: 100px; }

  .body { position: relative; padding: 30px 24px 24px; height: calc(812px - 92px - 96px); overflow-y: auto; }
  .title { font-size: 25px; font-weight: 800; line-height: 1.3; letter-spacing: -0.01em; margin-bottom: 22px; }

  .footer { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 30px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .continue-btn { width: 100%; height: 54px; border-radius: 18px; border: none; background: var(--accent); color: #2B2420; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 24px color-mix(in oklch, var(--accent) 40%, transparent); display: flex; align-items: center; justify-content: center; position: relative; padding: 0 20px; }
  .continue-btn .arrow { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .continue-btn .arrow svg { width: 18px; height: 18px; }

  .ring-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
  .play-btn { width: 130px; height: 130px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 30px color-mix(in oklch, var(--accent) 45%, transparent); margin-bottom: 22px; }
  .play-btn svg { width: 46px; height: 46px; color: #2B2420; }
  .ring-caption { font-size: 13.5px; font-weight: 700; color: var(--ink-soft); text-align: center; margin-bottom: 26px; }
  .tip-card { background: var(--card-bg); border-radius: 18px; padding: 18px 18px; box-shadow: 0 1px 2px rgba(43,36,32,0.05), 0 8px 20px rgba(43,36,32,0.06); }
  .tip-title { font-size: 13px; font-weight: 800; margin-bottom: 10px; }
  .tip-step { display: flex; align-items: flex-start; gap: 10px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 8px; line-height: 1.5; }
  .tip-num { width: 18px; height: 18px; border-radius: 50%; background: var(--accent-soft); color: color-mix(in oklch, var(--accent) 62%, black); font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }

</style>
</helmet>

<div class="screen" style="--bg: #F2F3F4; --ink: #2B2420; --ink-soft: #6B5D4F; --ink-faint: #9C8C7A; --card-bg: #FFFDF7; --track-off: #E3E5E7; --accent: {{accent}}; --accent-soft: color-mix(in oklch, var(--accent) 20%, white);">

  <div class="top-row">
    <button class="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="progress-track"><div class="progress-fill"></div></div>
  </div>

  <div class="body">

    <div class="title">Will you hear it?</div>
    <div class="ring-wrap">
      <div class="play-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></div>
      <div class="ring-caption">Playing at your Ringtone &amp; Alerts volume.<br>Tap to stop.</div>
      <div class="tip-card">
        <div class="tip-title">Too quiet? Fix it here:</div>
        <div class="tip-step"><span class="tip-num">1</span>Hold the Volume Up button now</div>
        <div class="tip-step"><span class="tip-num">2</span>Watch the alert-volume bar rise</div>
        <div class="tip-step"><span class="tip-num">3</span>Tap play again to double-check</div>
      </div>
    </div>

  </div>

  <div class="footer">
    <button class="continue-btn"><span>I'll hear it</span><span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span></button>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A623","options":["#F5A623","#E8940F","#D98A1F","#C77B14"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F5A623' };
  }
}
</script>
</body>
</html>
