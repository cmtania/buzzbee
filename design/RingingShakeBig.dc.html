<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .screen {
    width: 375px; height: 812px; position: relative; overflow: hidden;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f0f0;
    color: #2B2420;
  }
  a { color: #2B2420; }

  .blob-bg { position: absolute; inset: 0; pointer-events: none; }
  .blob-bg svg { width: 100%; height: 100%; display: block; }

  .top { position: relative; padding: 52px 24px 0; text-align: center; }
  .clock { font-size: 88px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; color: #fff; }
  .clock .ampm { font-size: 26px; font-weight: 700; color: #fff; opacity: 0.85; margin-left: 6px; }
  .status {
    margin: 18px auto 0; display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 800; color: color-mix(in oklch, var(--accent) 62%, black);
    background: #fff;
    padding: 7px 13px; border-radius: 100px;
    box-shadow: 0 1px 2px rgba(43,36,32,0.06), 0 8px 18px rgba(43,36,32,0.12);
  }
  .status svg { width: 14px; height: 14px; flex-shrink: 0; }

  .mission {
    position: absolute; width: 303px; height: 546px; top: 196px; left: 36px;
    padding: 26px 22px 22px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
  }
  .pill-eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accentsoft); color: color-mix(in oklch, var(--accent) 62%, black);
    font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 10px 20px; border-radius: 100px;
  }
  .counter { font-size: 96px; font-weight: 800; letter-spacing: -0.03em; line-height: 0.9; color: var(--accent); }
  .counter .total { font-size: 26px; font-weight: 700; color: #9C8C7A; margin-left: 4px; }
  .progress { width: 100%; height: 16px; background: #F1E7D3; border-radius: 100px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), color-mix(in oklch, var(--accent) 55%, white)); border-radius: 100px; box-shadow: 0 0 14px color-mix(in oklch, var(--accent) 60%, transparent); }
  .art { display: block; }
  .hint { font-size: 22px; font-weight: 800; color: #2B2420; line-height: 1.3; }

  .caption { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-size: 12px; font-weight: 700; opacity: 0.85; padding: 0 40px; }
</style>
</helmet>

<div class="screen" style="--accent: {{accent}}; --accentsoft: color-mix(in oklch, var(--accent) 20%, white);">

  <div class="blob-bg">
    <svg viewBox="0 0 540 960" preserveAspectRatio="none">
      <rect x="0" y="0" width="540" height="960" fill="#F2F3F4"></rect>
      <path d="M0 234L11.3 232.5C22.7 231 45.3 228 67.8 231.2C90.3 234.3 112.7 243.7 135.2 232.7C157.7 221.7 180.3 190.3 202.8 197C225.3 203.7 247.7 248.3 270.2 256C292.7 263.7 315.3 234.3 337.8 214C360.3 193.7 382.7 182.3 405.2 194.2C427.7 206 450.3 241 472.8 257.5C495.3 274 517.7 272 528.8 271L540 270L540 0L528.8 0C517.7 0 495.3 0 472.8 0C450.3 0 427.7 0 405.2 0C382.7 0 360.3 0 337.8 0C315.3 0 292.7 0 270.2 0C247.7 0 225.3 0 202.8 0C180.3 0 157.7 0 135.2 0C112.7 0 90.3 0 67.8 0C45.3 0 22.7 0 11.3 0L0 0Z" fill="var(--accent)" stroke-linecap="round" stroke-linejoin="miter"></path>
    </svg>
  </div>

  <div class="top">
    <div class="clock">6:46<span class="ampm">AM</span></div>
    <div class="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c1.5-4 3.5-4 5 0s3.5 4 5 0 3.5-4 5 0 3.5 4 5 0"/></svg>
      Light sleep detected &middot; 14 min ahead
    </div>
  </div>

  <div class="mission">
    <div class="pill-eyebrow">Shake to dismiss</div>
    <div class="counter">28<span class="total">/50</span></div>
    <div class="progress"><i style="width:56%"></i></div>
    <svg class="art" width="230" height="120" viewBox="0 0 230 120" fill="none">
      <path d="M66 40 Q46 60 66 80" stroke="#2B2420" stroke-width="4.5" stroke-linecap="round" opacity="0.55"/>
      <path d="M42 26 Q14 60 42 94" stroke="#2B2420" stroke-width="4.5" stroke-linecap="round" opacity="0.3"/>
      <path d="M164 40 Q184 60 164 80" stroke="#2B2420" stroke-width="4.5" stroke-linecap="round" opacity="0.55"/>
      <path d="M188 26 Q216 60 188 94" stroke="#2B2420" stroke-width="4.5" stroke-linecap="round" opacity="0.3"/>
      <g transform="rotate(-13 115 60)">
        <rect x="93" y="12" width="44" height="96" rx="12" fill="#fff" stroke="#2B2420" stroke-width="4.5"/>
        <rect x="101" y="24" width="28" height="66" rx="6" fill="var(--accent)" opacity="0.4"/>
        <circle cx="115" cy="99" r="3.6" fill="#2B2420"/>
      </g>
    </svg>
    <div class="hint">Keep shaking &mdash; 22 to go!</div>
  </div>

  <div class="caption">Snoozing is disabled &mdash; finish the mission to dismiss.</div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#E8940F","options":["#E8940F","#F5A623","#D98A1F","#C77B14"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#E8940F' };
  }
}
</script>
</body>
</html>
