<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .board { width: 420px; height: 320px; background: #EDEAE2; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .comb-bg {
    position: absolute; inset: 0; opacity: 0.05; pointer-events: none;
    background-image:
      repeating-linear-gradient(60deg, #2B2420 0 2px, transparent 2px 34px),
      repeating-linear-gradient(-60deg, #2B2420 0 2px, transparent 2px 34px),
      repeating-linear-gradient(0deg, #2B2420 0 2px, transparent 2px 34px);
  }
  .art { width: 340px; height: 260px; }
</style>
</helmet>

<div class="board">
  <div class="comb-bg"></div>
  <svg class="art" viewBox="0 0 420 300">
    <defs>
      <clipPath id="mascotBodyClip">
        <ellipse cx="215" cy="150" rx="120" ry="82"/>
      </clipPath>
      <linearGradient id="mascotBodyGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FFD98A"/>
        <stop offset="100%" stop-color="#F5A623"/>
      </linearGradient>
    </defs>

    <g transform="rotate(-14 215 150)">

      <!-- wings, behind the body -->
      <ellipse cx="258" cy="82" rx="34" ry="48" fill="rgba(255,255,255,0.72)" stroke="#2B2420" stroke-width="2.5" transform="rotate(-25 258 82)"/>
      <ellipse cx="284" cy="98" rx="29" ry="42" fill="rgba(255,255,255,0.55)" stroke="#2B2420" stroke-width="2.5" transform="rotate(-14 284 98)"/>

      <!-- tail nub -->
      <path d="M328 140 Q347 149 333 168 Q320 152 328 140 Z" fill="#F5A623" stroke="#2B2420" stroke-width="3" stroke-linejoin="round"/>

      <!-- body: fill + stripes + belly patch, clipped to the body silhouette -->
      <g clip-path="url(#mascotBodyClip)">
        <rect x="90" y="60" width="255" height="185" fill="url(#mascotBodyGrad)"/>
        <rect x="222" y="55" width="17" height="190" fill="#2B2420"/>
        <rect x="257" y="55" width="17" height="190" fill="#2B2420"/>
        <rect x="292" y="55" width="15" height="190" fill="#2B2420"/>
        <ellipse cx="248" cy="188" rx="46" ry="22" fill="#F3EEE0" opacity="0.7"/>
      </g>
      <ellipse cx="215" cy="150" rx="120" ry="82" fill="none" stroke="#2B2420" stroke-width="4.5"/>

      <!-- legs -->
      <ellipse cx="300" cy="217" rx="15" ry="10.5" fill="#F5A623" stroke="#2B2420" stroke-width="3"/>
      <ellipse cx="321" cy="209" rx="13.5" ry="9.5" fill="#F5A623" stroke="#2B2420" stroke-width="3"/>
      <ellipse cx="283" cy="224" rx="12.5" ry="9" fill="#F5A623" stroke="#2B2420" stroke-width="3"/>

      <!-- antennae -->
      <path d="M132 90 Q118 54 98 48" stroke="#2B2420" stroke-width="6" fill="none" stroke-linecap="round"/>
      <circle cx="98" cy="48" r="6.5" fill="#2B2420"/>
      <path d="M151 86 Q167 48 192 44" stroke="#2B2420" stroke-width="6" fill="none" stroke-linecap="round"/>
      <circle cx="192" cy="44" r="6.5" fill="#2B2420"/>

      <!-- glasses / face -->
      <circle cx="118" cy="142" r="58" fill="#EDE9DD" stroke="#2B2420" stroke-width="6.5"/>
      <ellipse cx="104" cy="116" rx="24" ry="11" fill="#fff" opacity="0.55" transform="rotate(-25 104 116)"/>
      <circle cx="101" cy="149" r="13" fill="#2B2420"/>
      <circle cx="96" cy="144" r="4" fill="#fff"/>

    </g>
  </svg>
</div>
</x-dc>
</body>
</html>
